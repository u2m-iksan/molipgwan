<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몰입관 · 연결 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#fff;--surface:#F2F4F6;--line:#E5E8EB;--text:#191F28;--sub:#6B7684;--blue:#3182F6;--green:#0E8A4E;--red:#D22030}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;background:var(--surface);color:var(--text);letter-spacing:-0.01em;
    min-height:100vh;display:grid;place-items:center;padding:20px}
  .card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:28px 24px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .brand b{font-size:20px;font-weight:900;letter-spacing:-0.04em}
  .brand span{font-size:16px;font-weight:700;padding-left:10px;border-left:2px solid var(--text);line-height:1.1}
  h1{font-size:20px;font-weight:700;margin-bottom:4px}
  p{font-size:14px;color:var(--sub);margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:12px 0 6px}
  .idrow{display:flex;align-items:center;height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
  .idrow em{font-style:normal;color:var(--sub);font-size:15px}
  input{font:inherit;font-size:15px;border:0;background:none;outline:none;color:var(--text);width:100%}
  .pw{height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
  .idrow:focus-within,.pw:focus{border-color:var(--blue);background:#fff}
  button{margin-top:18px;width:100%;height:50px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5}
  #out{margin-top:16px;font-size:14px;line-height:1.6;min-height:22px}
  .ok{color:var(--green);font-weight:600} .err{color:var(--red);font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><b>U2M</b><span>몰입관</span></div>
  <h1>연결 테스트</h1>
  <p>선생님 계정으로 로그인해서 Supabase 연결과 권한을 확인해요.</p>
  <form id="f">
    <label for="id">아이디</label>
    <div class="idrow"><input id="id" autocomplete="username" placeholder="kkb" required></div>
    <label for="pw">비밀번호</label>
    <input class="pw" id="pw" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">로그인</button>
  </form>
  <div id="out"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const sb = createClient('https://pnefvpudosqdadwegrof.supabase.co', 'sb_publishable_RrxJqy32HMExcQb28ZJPRg_zJErWNXI');
  const out = document.getElementById('out'), go = document.getElementById('go');
  const show = (cls, msg) => { out.className = cls; out.textContent = msg; };

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    go.disabled = true; show('', '확인 중…');
    const id = document.getElementById('id').value.trim().toLowerCase();
    const email = `t-${id}@molipgwan.app`;
    const { error } = await sb.auth.signInWithPassword({ email, password: document.getElementById('pw').value });
    if (error) { go.disabled = false; return show('err', '로그인 실패: ' + error.message); }

    const { data, error: e2 } = await sb.from('teachers').select('name').eq('email', email);
    go.disabled = false;
    if (e2) return show('err', '로그인은 됐는데 데이터 읽기 실패: ' + e2.message);
    if (!data.length) return show('err', '로그인은 됐는데 teachers 테이블에 등록이 안 돼 있어요.');
    show('ok', `✓ 연결 성공 — ${data[0].name} 선생님으로 로그인됐어요.`);
    await sb.auth.signOut();
  });
</script>
</body>
</html>
