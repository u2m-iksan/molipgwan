# Supabase 무료 플랜은 7일 동안 요청이 없으면 일시 정지됨 → 사흘마다 DB에 가벼운 요청 1번
# (공개용 키만 사용 · 방학 등으로 아무도 앱을 안 열어도 멈추지 않게)
name: supabase-keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'   # 사흘마다 KST 12:17
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://pnefvpudosqdadwegrof.supabase.co/rest/v1/app_settings?select=key&limit=1' \
            -H 'apikey: sb_publishable_RrxJqy32HMExcQb28ZJPRg_zJErWNXI')
          echo "status $code"
          test "$code" -lt 500
